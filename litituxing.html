<!DOCTYPE html>

<body>
    <!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D 几何体展示：五棱柱、四棱台、圆台</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #1a1a1a;
            font-family: sans-serif;
        }
        #info {
            position: absolute;
            top: 10px;
            width: 100%;
            text-align: center;
            color: white;
            pointer-events: none;
            z-index: 10;
        }
        canvas {
            display: block;
        }
    </style>
    <!-- 引入 Three.js -->
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>
</head>
<body>
   
    <div id="info">
        <h1>赵匡胤xAi巨献</h1>
        左: 倾斜的五棱柱 | 中: 四棱台 (方台) | 右: 圆台<br>
        拖动鼠标旋转视角，滚动缩放
    </div>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

        // 1. 场景设置
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x202025);
        // 添加一些雾效增加深度感
        scene.fog = new THREE.Fog(0x202025, 10, 50);

        // 2. 相机设置
        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 5, 12);

        // 3. 渲染器设置
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        document.body.appendChild(renderer.domElement);

        // 4. 控制器
        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;

        // 5. 灯光
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
        scene.add(ambientLight);

        const dirLight = new THREE.DirectionalLight(0xffffff, 1);
        dirLight.position.set(5, 10, 7);
        dirLight.castShadow = true;
        scene.add(dirLight);

        const pointLight = new THREE.PointLight(0xffaa00, 0.5);
        pointLight.position.set(-5, 5, -5);
        scene.add(pointLight);

        // --- 创建几何体函数 ---

        // 材质复用
        const materialPentagon = new THREE.MeshStandardMaterial({ 
            color: 0x3498db, 
            roughness: 0.3, 
            metalness: 0.1,
            flatShading: true // 平面着色，让棱更明显
        });
        
        const materialSquareFrustum = new THREE.MeshStandardMaterial({ 
            color: 0xe74c3c, 
            roughness: 0.3, 
            metalness: 0.1,
            flatShading: true
        });

        const materialConeFrustum = new THREE.MeshStandardMaterial({ 
            color: 0x2ecc71, 
            roughness: 0.3, 
            metalness: 0.1,
            flatShading: false // 平滑着色
        });

        // A. 略微倾斜的五棱柱
        // CylinderGeometry: radiusTop, radiusBottom, height, radialSegments
        const pentagonGeometry = new THREE.CylinderGeometry(1, 1, 2.5, 5);
        const pentagonMesh = new THREE.Mesh(pentagonGeometry, materialPentagon);
        
        // 倾斜逻辑：绕 Z 轴旋转 15 度 (约 0.26 弧度)
        pentagonMesh.rotation.z = Math.PI / 12; 
        pentagonMesh.position.set(-3.5, 0, 0);
        pentagonMesh.castShadow = true;
        pentagonMesh.receiveShadow = true;
        scene.add(pentagonMesh);

        // B. 四棱台 (方台)
        // 使用 CylinderGeometry 并设置 radialSegments 为 4
        // 顶部半径 0.6, 底部半径 1.2, 高度 2.5
        const squareFrustumGeometry = new THREE.CylinderGeometry(0.6, 1.2, 2.5, 4);
        const squareFrustumMesh = new THREE.Mesh(squareFrustumGeometry, materialSquareFrustum);
        
        // 默认 Cylinder 的 4 段是菱形放置的，旋转 PI/4 让它正对
        squareFrustumMesh.rotation.y = Math.PI / 4;
        squareFrustumMesh.position.set(0, 0, 0);
        squareFrustumMesh.castShadow = true;
        squareFrustumMesh.receiveShadow = true;
        scene.add(squareFrustumMesh);

        // C. 圆台
        // 顶部半径 0.7, 底部半径 1.3, 高度 2.5, 径向分段 32 (足够圆滑)
        const coneFrustumGeometry = new THREE.CylinderGeometry(0.7, 1.3, 2.5, 32);
        const coneFrustumMesh = new THREE.Mesh(coneFrustumGeometry, materialConeFrustum);
        coneFrustumMesh.position.set(3.5, 0, 0);
        coneFrustumMesh.castShadow = true;
        coneFrustumMesh.receiveShadow = true;
        scene.add(coneFrustumMesh);

        // 添加地面网格辅助
        const gridHelper = new THREE.GridHelper(20, 20, 0x444444, 0x222222);
        gridHelper.position.y = -1.25; // 稍微下移，让物体看起来放在地上
        scene.add(gridHelper);

        // 6. 动画循环
        function animate() {
            requestAnimationFrame(animate);
            
            // 可选：让物体缓慢自转展示
            // pentagonMesh.rotation.y += 0.005;
            // squareFrustumMesh.rotation.y += 0.005;
            // coneFrustumMesh.rotation.y += 0.005;

            controls.update();
            renderer.render(scene, camera);
        }

        // 7. 窗口大小调整处理
        window.addEventListener('resize', onWindowResize, false);
        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        animate();
    </script>
</body>
</html>

</body>
</html>
